$('seal').onclick=()=>{$('gate').classList.add('out');setTimeout(()=>{$('gate').style.display='none';$('card').classList.add('show');[...$('st').children].forEach((c,i)=>c.style.animationDelay=(.15+i*.11)+'s');scrollTo(0,0);au.play().then(()=>setPlay(true)).catch(()=>setPlay(false))},450)};
$('mb').onclick=()=>{au.paused?au.play().then(()=>setPlay(true)).catch(()=>{}):(au.pause(),setPlay(false))};
au.onpause=()=>setPlay(false);au.onplay=()=>setPlay(true);
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.vplay');if(!b)return;const w=b.closest('.vb'),v=w.querySelector('video');document.querySelectorAll('.vb video').forEach(x=>{if(x!==v)x.pause()});v.play().then(()=>w.classList.add('on')).catch(()=>{v.controls=true;w.classList.add('on')})});
document.addEventListener('play',e=>{const v=e.target;if(!(v&&v.tagName==='VIDEO'))return;v.closest('.vb').classList.add('on');document.querySelectorAll('.vb video').forEach(x=>{if(x!==v)x.pause()});if(!au.paused){au.dataset.resume='1';au.pause()}},true);
document.addEventListener('pause',e=>{const v=e.target;if(!(v&&v.tagName==='VIDEO'))return;if(![...document.querySelectorAll('.vb video')].some(x=>!x.paused)&&au.dataset.resume==='1'){au.dataset.resume='';au.play().catch(()=>{})}},true);
const lbClose=()=>{$('lb').classList.remove('on');$('lb').innerHTML=''};$('lb').addEventListener('click',lbClose);addEventListener('keydown',e=>{if(e.key==='Escape')lbClose()});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.gal button');if(b){$('lb').innerHTML='<img alt="" src="'+esc(gallery[+b.dataset.i])+'">';$('lb').classList.add('on')}});
}
</script><script src="fx.js" defer></script></body></html>
