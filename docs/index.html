<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>Marhabo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#2B2219;--mut:#7A6A57;--ac:#B28A50;--line:#EDE3D4;--bg:#FCF9F3}
html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.fd{font-family:'Cormorant Garamond',Georgia,serif}.up{text-transform:uppercase}
#glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(90% 55% at 85% -8%,#F5E9D3 0%,transparent 60%),radial-gradient(70% 40% at -10% 30%,#F4E6E1 0%,transparent 60%)}
#app{position:relative;max-width:560px;margin:0 auto;padding:0 18px 120px}
/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;padding:20px 0 6px}
.logo{font-size:27px;line-height:1}.logo small{font-family:Manrope;font-size:8.5px;letter-spacing:.26em;color:#A08D74;text-transform:uppercase;margin-left:7px}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
@media(max-width:340px){.nav{gap:4px}.nav a,.nav button.l{letter-spacing:.1em;padding:0 2px}.lang button{padding:0 8px}}
.nav a,.nav button.l{font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);background:none;border:0;cursor:pointer;min-height:40px;padding:0 4px}
.lang{display:inline-flex;border:1px solid #E4D8C6;border-radius:99px;padding:2px;background:rgba(255,255,255,.55)}
.lang button{border:0;background:none;font:inherit;font-size:10px;letter-spacing:.14em;color:#7A6A57;border-radius:99px;padding:0 12px;min-height:34px;cursor:pointer}
.lang button.on{background:var(--ink);color:#FBF6EE}
/* hero */
.eb{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--ac);margin-top:26px}
h1.hero{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(2.7rem,12.5vw,4rem);line-height:.96;margin-top:16px;max-width:11ch}
.sub{margin-top:18px;font-size:15px;line-height:1.65;color:#6E6152;max-width:44ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.b{display:inline-flex;align-items:center;gap:9px;border-radius:99px;padding:14px 24px;font:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;border:1px solid transparent;text-decoration:none;transition:.25s}
.b.d{background:var(--ink);color:#FBF6EE}.b.d:active{background:#3D3125}
.b.o{border-color:#DFD2BE;color:#6E6152;background:transparent}
.b svg{transition:transform .25s}.b:hover svg{transform:translateX(4px)}
.feat{list-style:none;margin-top:26px;display:grid;gap:11px}
.feat li{display:flex;gap:10px;font-size:13.5px;color:#6E6152;align-items:flex-start}
.feat i{flex:none;width:16px;height:16px;border-radius:99px;background:#EFE4D3;color:var(--ac);display:grid;place-items:center;margin-top:1px}
/* демо-открытка: парение */
.demo{position:relative;margin:46px auto 0;max-width:330px}
.demo:before{content:"";position:absolute;left:50%;top:-30px;width:320px;height:320px;transform:translateX(-50%);border-radius:99px;filter:blur(48px);background:radial-gradient(circle,rgba(178,138,80,.26),transparent 70%);pointer-events:none}
.dwrap{opacity:0;transform:translateY(28px) rotate(-1.5deg);animation:dIn 1s cubic-bezier(.22,1,.36,1) .15s forwards}
@keyframes dIn{to{opacity:1;transform:translateY(0) rotate(-1.5deg)}}
.dcard{position:relative;overflow:hidden;border-radius:24px;padding:28px 22px 30px;text-align:center;border:1px solid #EADBC4;background:linear-gradient(180deg,#FFFEFB 0%,#FBF3E6 100%);box-shadow:0 40px 80px -50px rgba(43,34,25,.6);animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(-7px)}50%{transform:translateY(7px)}}
.dcard .in{position:absolute;inset:7px;border-radius:18px;border:1px solid #EADBC4;pointer-events:none;z-index:2}
.dcov{position:relative;margin:-28px -22px 18px;height:150px;overflow:hidden}
.dcov img{width:100%;height:100%;object-fit:cover}.dcov:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),#FFFEFB)}
.dchips{display:flex;justify-content:center;gap:8px;margin-top:16px}
.dchips span{border-radius:99px;padding:6px 15px;font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.dstat{position:absolute;left:-6px;bottom:-20px;z-index:3;border-radius:14px;border:1px solid #E7DCCA;background:rgba(255,255,255,.92);padding:9px 13px;box-shadow:0 16px 30px -24px rgba(43,34,25,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:float2 11s ease-in-out infinite}
@keyframes float2{0%,100%{transform:translateY(6px)}50%{transform:translateY(-6px)}}
.dstat p{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#A08D74}.dstat b{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:19px}
/* секции */
.sec{margin-top:70px;border-top:1px solid #EADFCE;padding-top:30px}
.sec h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(1.9rem,8vw,2.5rem);line-height:1.05}
.sec>p{margin-top:10px;font-size:13.5px;line-height:1.6;color:var(--mut);max-width:38ch}
.rv{opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}.rv.on{opacity:1;transform:none}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:22px}
.tc{display:flex;flex-direction:column;overflow:hidden;border-radius:18px;text-align:left;cursor:pointer;font:inherit;color:inherit;padding:0;transition:transform .5s,box-shadow .5s;border:1px solid}
.tc:active{transform:translateY(-3px)}
.tc .im{position:relative;height:128px;overflow:hidden}.tc img{width:100%;height:100%;object-fit:cover;transition:transform .7s}.tc:active img,.tc:hover img{transform:scale(1.07)}
.tc .im:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.02) 45%,var(--tb))}
.tc .tag{position:absolute;left:9px;top:9px;z-index:2;border-radius:99px;background:rgba(255,255,255,.88);padding:4px 9px;font-size:8px;letter-spacing:.2em;text-transform:uppercase;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tc .tx{padding:2px 10px 16px;text-align:center}.tc .nm{font-family:'Cormorant Garamond',serif;font-size:clamp(17px,5.1vw,20px);line-height:1.15;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tc .nm i{margin:0 3px}.tc .ht{font-size:9.5px;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{margin-top:18px;border-top:1px solid #EADFCE}.steps>div{padding:22px 0;border-bottom:1px solid #EADFCE}
.steps .n{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.24em;color:var(--ac)}.steps h3{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:23px;margin-top:8px}.steps p{margin-top:6px;font-size:13.5px;line-height:1.6;color:var(--mut)}
.foot{margin-top:56px;text-align:center}.foot .fd{font-size:24px}.foot p{font-size:11px;letter-spacing:.16em;color:#A08D74;text-transform:uppercase;margin-top:4px}
/* форма */
.ph{display:flex;align-items:center;gap:10px;padding:18px 0 4px}
.back{border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:99px;font-size:17px;cursor:pointer;color:var(--ink)}
.ph h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:30px}
.lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#A08D74;margin:20px 0 8px}
.lbl em{font-style:normal;text-transform:none;letter-spacing:0;opacity:.8;margin-left:6px}
input,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;font:inherit;font-size:15px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(178,138,80,.14)}
textarea{min-height:88px;resize:vertical;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tp{border:1px solid var(--line);background:#fff;border-radius:14px;padding:0;overflow:hidden;cursor:pointer;font:inherit;color:inherit;text-align:center;transition:.2s}
.tp img{width:100%;height:54px;object-fit:cover;display:block}.tp b{display:block;font-size:11.5px;font-weight:600;padding:7px 4px 2px}.tp s{display:flex;gap:4px;justify-content:center;padding:0 0 8px;text-decoration:none}.tp s i{width:10px;height:10px;border-radius:99px}
.tp.on{border-color:var(--ac);box-shadow:0 0 0 1.5px var(--ac)}
.prow{display:grid;grid-template-columns:100px 1fr 40px;gap:8px;margin-bottom:8px}
.x{border:1px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;font-size:18px;color:#8B7A66}
.hint{font-size:11.5px;color:#A08D74;margin-top:7px;line-height:1.5}
.pvf{position:fixed;inset:0;z-index:60;background:#14100b;display:flex;flex-direction:column}
.pvf .tb{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));color:#EDE3D2;font-size:12px}
.pvf .tb button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:99px;min-height:36px;padding:0 16px;font:600 12px Manrope,sans-serif;cursor:pointer}
.pvf iframe{flex:1;width:100%;border:0;background:#FCF9F3}
.pvbtn{width:100%;margin-top:10px;min-height:46px;border:1px solid #B28A50;background:#fff;color:#8B6A33;border-radius:12px;font:700 12px Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.pv{margin-top:26px}.pv .t{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#A08D74;margin-bottom:10px}.pv .t:before,.pv .t:after{content:"";flex:1;height:1px;background:var(--line)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:11px 18px calc(11px + env(safe-area-inset-bottom));background:rgba(252,249,243,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar .b{width:100%;justify-content:center}
.err{color:#B4433A;font-size:12.5px;text-align:center;min-height:18px;margin-top:12px}

.up2{border:1px dashed #D9C9AE;background:rgba(255,255,255,.7);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;transition:.2s}
.up2.has{border-style:solid;border-color:var(--ac);background:#fff}
.th{flex:none;width:64px;height:64px;border-radius:12px;background:#F4EBDB center/cover no-repeat;display:grid;place-items:center;color:#B9A27A;font-size:22px;overflow:hidden;position:relative}
.th.au{background:#F4EBDB}
.up2 .ti{flex:1;min-width:0}.up2 .ti b{display:block;font-weight:500;font-size:14px}.up2 .ti span{display:block;font-size:11.5px;color:#A08D74;margin-top:2px;line-height:1.4}
.up2 .ac{display:flex;flex-direction:column;gap:6px;flex:none}
.sm{border:1px solid #E1D3BC;background:#fff;border-radius:99px;padding:0 13px;min-height:34px;font:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6E6152;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.sm.pr{background:var(--ink);color:#FBF6EE;border-color:var(--ink)}
.sm.rm{color:#B4433A;border-color:#EBCFCA}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.gr .gi{aspect-ratio:1;border-radius:12px;background:#F4EBDB center/cover;position:relative;overflow:hidden}
.gr .gi button{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:99px;border:0;background:rgba(43,34,25,.72);color:#fff;font-size:15px;cursor:pointer}
.gr .ad{aspect-ratio:1;border-radius:12px;border:1px dashed #D9C9AE;background:rgba(255,255,255,.7);display:grid;place-items:center;color:#B9A27A;font-size:26px;cursor:pointer}
.tag2{display:inline-block;border-radius:99px;padding:2px 8px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:5px}
.tag2.ok{background:#E9F2EC;color:#2F6B52}.tag2.wt{background:#FBF1DF;color:#9A6B1E}
.lib{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.lib .it{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #F0E7D9}.lib .it:last-child{border:0}
.lib .it .th{width:44px;height:44px;font-size:16px}.lib .it .n{flex:1;font-size:12px;color:#7A6A57;min-width:0}
/* мои */
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 18px 40px -34px var(--ink)}
.card h3{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:26px;line-height:1.1}
.meta{color:var(--mut);font-size:12px;margin-top:4px}
.mini{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.b.s{padding:10px 16px;font-size:10px;letter-spacing:.14em}
.empty{text-align:center;color:var(--mut);padding:50px 14px;font-size:14px;line-height:1.6}
/* панель */
.sm2{margin-top:16px;padding:16px;border:1px solid #E7DAC6;border-radius:16px;background:#fff}
.sm2 h4{margin:0 0 12px;font:600 11px Manrope,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#8B7A66}
.sm2 .big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.sm2 .big b{font:500 34px 'Cormorant Garamond',Georgia,serif;color:#2B2219}.sm2 .big span{font-size:13px;color:#8B7A66}
.sm2 .bar2{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#F3EADB;margin:12px 0 8px}.sm2 .bar2 i{display:block;height:100%}
.sm2 .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#8B7A66}.sm2 .lg em{font-style:normal;display:inline-flex;align-items:center;gap:5px}.sm2 .lg em:before{content:'';width:8px;height:8px;border-radius:99px;background:var(--c)}
.sm2 .rw{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid #F0E7D9;font-size:13px;color:#8B7A66}.sm2 .rw b{color:#2B2219;font-weight:600;text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:14px;padding:12px 10px;transition:.25s;cursor:pointer;font:inherit;text-align:left;color:inherit}
.stat.on{background:#fff;box-shadow:0 0 0 1.5px var(--c) inset}
.stat p{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#A08D74}.stat b{display:block;margin-top:5px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:28px;line-height:1;color:var(--c)}
.gl{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.vgrid{display:grid;gap:10px;margin-top:8px}
.vi{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #E7DAC6;border-radius:14px;background:#fff}
.vi .vt{flex:none;position:relative;width:78px;border-radius:9px;background:#2a2118 center/cover;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff}
.vi .vt.l{aspect-ratio:16/9}.vi .vt.p{aspect-ratio:9/16;width:46px}
.vi .vt svg{opacity:.9}
.vi .vm{flex:1;min-width:0;font-size:12px;color:#8B7A66;line-height:1.4}.vi .vm b{display:block;color:#2B2219;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vi .vo{display:flex;gap:6px;margin-top:6px}
.vi .vo button{flex:1;min-height:34px;border:1px solid #E7DAC6;border-radius:9px;background:#fff;font:600 11px Manrope,sans-serif;color:#8B7A66;cursor:pointer}
.vi .vo button.on{background:#B28A50;border-color:#B28A50;color:#fff}
.vi .vx{flex:none;width:34px;height:34px;border:0;border-radius:99px;background:#F3EADB;color:#8B7A66;font-size:18px;cursor:pointer}
.g{display:flex;align-items:center;gap:7px;padding:11px 12px;border-bottom:1px solid #F0E7D9}.g:last-child{border:0}
.av{flex:none;width:36px;height:36px;border-radius:99px;background:#F5EBDB;color:#8A6A3B;display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-size:16px}
.g .n{flex:1;min-width:0}.g .n b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:11px;margin-top:4px}
.chip.y{background:#E9F2EC;color:#2F6B52}.chip.n{background:#FBEDE9;color:#9C3B2A}.chip.p{background:#F4EFE7;color:#8A7B68}
.ib{flex:none;border:1px solid #E7DCCA;background:#fff;border-radius:11px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:#6E6152;-webkit-tap-highlight-color:transparent}.ib:active{transform:scale(.94)}
.ib.ok{background:#EEF5F0;border-color:#B9D3C2;color:#2F6B52}
.lk{display:flex;gap:8px;margin-top:12px}.lk input{font-size:12px}
.done{text-align:center;padding:40px 0 10px}.done .ck{width:66px;height:66px;border-radius:99px;background:var(--ac);color:#fff;display:grid;place-items:center;margin:0 auto 16px;font-size:30px;animation:pop .6s cubic-bezier(.22,1,.36,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.view{animation:vin .5s cubic-bezier(.22,1,.36,1)}@keyframes vin{from{opacity:0;transform:translateY(14px)}}
.syncb{display:flex;gap:10px;align-items:center;margin:0 0 10px;padding:11px 13px;border-radius:12px;background:#FBF1DE;border:1px solid #EBD6A8;font-size:13px;color:#6B4F1D}.syncb small{display:block;opacity:.8;font-size:11px;margin-top:2px}.syncb.ok{background:#EAF5EC;border-color:#BCDDC3;color:#25603A}.syncb .dot{width:9px;height:9px;border-radius:99px;background:#B28A50;animation:pls 1.2s ease-in-out infinite;flex:none}@keyframes pls{50%{opacity:.25;transform:scale(.7)}}
.seg2{display:inline-flex;border:1px solid #E4D8C6;border-radius:99px;padding:2px;background:rgba(255,255,255,.6)}.seg2 button{border:0;background:none;font:inherit;font-size:12px;color:#7A6A57;border-radius:99px;padding:0 14px;min-height:34px;cursor:pointer}.seg2 button.on{background:#2B2219;color:#FBF6EE}
.sg4{display:grid;grid-template-columns:repeat(4,1fr);width:100%;border-radius:14px}.sg4 button{padding:0 4px;font-size:12px;min-height:40px;border-radius:12px}
.thm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.th{border:1px solid #E4D8C6;background:rgba(255,255,255,.6);border-radius:14px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:inherit;min-width:0;transition:transform .15s,box-shadow .2s,border-color .2s}
.th i{width:34px;height:34px;border-radius:50%;box-shadow:0 6px 12px -6px rgba(0,0,0,.5)}.th b{font-size:10px;font-weight:500;color:#5C4E3C;text-align:center;line-height:1.15;overflow-wrap:anywhere}

/* ---- хранилище ----
   CloudStorage: значение <= 4096 симв., ключей <= 1024. Каждое приглашение режется на части по 3500 симв.
   под ключами inv_<id>_<n>, список id лежит в idx. Локальные превью (pv) в облако не попадают. */
const cs=V('6.9')?tg.CloudStorage:null;
const CH=3500, LK='taklif_v3';
const L={get:()=>{try{return JSON.parse(localStorage.getItem(LK)||'[]')}catch{return[]}},set:a=>{try{localStorage.setItem(LK,JSON.stringify(a))}catch(e){}}};
const clean=it=>{const c=JSON.parse(JSON.stringify(it));delete c.pv;if(c.gl)c.gl=c.gl.filter(g=>g.url).map(g=>({url:g.url}));if(c.vl)c.vl=c.vl.filter(v=>v.url).map(v=>({url:v.url,o:v.o==='p'?'p':'l'}));return c};
const csGet=k=>new Promise(r=>{let d=false;const f=v=>{if(!d){d=true;r(v)}};try{cs.getItem(k,(e,v)=>f(e?null:v))}catch(e){f(null)}setTimeout(()=>f(null),2500)});
const csSet=(k,v)=>new Promise(r=>{let d=false;const f=ok=>{if(!d){d=true;r(ok)}};try{cs.setItem(k,v,(e,ok)=>f(!e&&ok!==false))}catch(e){f(false)}setTimeout(()=>f(false),2500)});
const csDel=ks=>new Promise(r=>{if(!ks.length)return r();let d=false;const f=()=>{if(!d){d=true;r()}};try{cs.removeItems(ks,f)}catch(e){f()}setTimeout(f,2500)});
const store={
 async get(){
  const loc=L.get(); if(!cs)return loc;
  try{
   const idx=JSON.parse(await csGet('idx')||'null'); if(!Array.isArray(idx))return loc;
   const out=[];
   for(const e of idx){let s='';for(let n=0;n<e.n;n++){const part=await csGet('inv_'+e.id+'_'+n);if(part==null){s=null;break}s+=part}
    if(s){try{out.push(JSON.parse(s))}catch(x){}}}
   // локальные копии содержат превью — берём их, если id совпал
   return out.map(o=>{const l=loc.find(x=>x.id===o.id);return l?{...o,pv:l.pv||{},gl:(l.gl&&l.gl.length>=(o.gl||[]).length)?l.gl:o.gl}:o});
  }catch(e){return loc}},
 async set(items){
  L.set(items); if(!cs)return;
  let old=[];try{old=JSON.parse(await csGet('idx')||'[]')||[]}catch(e){}
  const idx=[];
  for(const it of items){const js=JSON.stringify(clean(it));const parts=[];for(let i=0;i<js.length;i+=CH)parts.push(js.slice(i,i+CH));
   let ok=true;for(let n=0;n<parts.length;n++){if(!await csSet('inv_'+it.id+'_'+n,parts[n])){ok=false;break}}
   if(ok)idx.push({id:it.id,n:parts.length})}
  await csSet('idx',JSON.stringify(idx));
  // убрать устаревшие ключи (удалённые приглашения и лишние части)
  const drop=[];for(const e of old){const cur=idx.find(x=>x.id===e.id);for(let n=cur?cur.n:0;n<e.n;n++)drop.push('inv_'+e.id+'_'+n)}
  await csDel(drop)}};
const persist=()=>store.set(ST.items);

 const ph={};const c=rel(it.c),pt=rel(it.o),mu=rel(it.u);if(c)ph.c=c;if(pt)ph.o=pt;
 const g=(it.gl||[]).map(x=>rel(x.url)).filter(Boolean).slice(0,6);if(g.length)ph.g=g;

 if(mu)o.u=mu; if(Object.keys(ph).length)o.p=ph;

function imgFP(src){return new Promise(res=>{const im=new Image();if(!/^data:/.test(src))im.crossOrigin='anonymous';im.onerror=()=>res(null);im.onload=()=>{try{const c=document.createElement('canvas');c.width=8;c.height=8;const x=c.getContext('2d');x.drawImage(im,0,0,8,8);const d=x.getImageData(0,0,8,8).data,g=[];for(let i=0;i<64;i++)g.push(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11);const m=g.reduce((a,b)=>a+b,0)/64;res(g.map(v=>v>m?1:0).join(''))}catch(e){res(null)}};im.src=src})}

  let n=0; const ph=fresh('photo'), au=fresh('audio'), vd=fresh('video');

  for(const sl of slots){
    if(sl.kind==='video'){
      const v=d.vl[sl.i], hit=vd.find(x=>Math.abs((+x.kb||0)-(v.kb||0))<=3)||(vd.length===1&&(d.vl.filter(z=>!z.url).length===1)?vd[0]:null);
      if(hit){v.url=hit.url;if(hit.o)v.o=hit.o;delete v.pv;delete v.nm;vd.splice(vd.indexOf(hit),1);n++}
      continue;
    }
    if(sl.kind==='audio'){
      const want=d.pv.uK, hit=au.find(x=>Math.abs((+x.kb||0)-want)<=2)||(au.length===1?au[0]:null);
      if(hit){d.u=hit.url;delete d.pv.u;delete d.pv.uN;delete d.pv.uK;au.splice(au.indexOf(hit),1);n++}
      continue;
    }
    let best=null,bd=99; for(const c of fps){const dd=ham(fpOf(sl),c.f);if(dd<bd){bd=dd;best=c}}
    if(best&&bd<=10){put(sl,best.x);fps.splice(fps.indexOf(best),1)}else left.push(sl);
  }
  // 2 проход: что не опознали по картинке — по порядку загрузки
  for(const sl of left){const c=fps.shift();if(c)put(sl,c.x)}
  return n;
}

async function syncFiles(){

  try{
    await loadLib(); let changed=false;
    if(ST.draft&&pendingCount()&&(await autoAttach(ST.draft))) changed=true;
    for(const it of waitingItems()){
      const n=await autoAttach(it);

    }

  }finally{_polling=0}
}

function summaryCard(it,c){
 const tot=c.total; if(!tot)return '';
 const pct=n=>Math.round(n*100/tot), ans=c.y+c.n;
 const times=it.guests.map(g=>{const e=ST.log[it.id+':'+g.k]||{};return e.s&&e.t?Date.parse(e.t):0}).filter(Boolean).sort((a,b)=>b-a);
 const day=times.filter(x=>Date.now()-x<864e5).length;
 const ago=ms=>{const m=Math.max(0,Math.round((Date.now()-ms)/6e4));return m<1?t('sumNow'):m<60?t('sumAgo').replace('{n}',m):m<1440?t('sumAgoH').replace('{n}',Math.round(m/60)):fmtD(new Date(ms).toISOString().slice(0,10))};
 return '<div class="sm2"><h4>'+t('sum')+'</h4><div class="big"><b>'+c.y+'</b><span>'+t('cYes').toLowerCase()+' '+t('gOf')+' '+tot+'</span></div>'
  +'<div class="bar2"><i style="width:'+pct(c.y)+'%;background:#2F6B52"></i><i style="width:'+pct(c.n)+'%;background:#9C3B2A"></i><i style="width:'+pct(c.p)+'%;background:#D9CBB4"></i></div>'
  +'<div class="lg"><em style="--c:#2F6B52">'+t('cYes')+' '+c.y+'</em><em style="--c:#9C3B2A">'+t('cNo')+' '+c.n+'</em><em style="--c:#D9CBB4">'+t('cPe')+' '+c.p+'</em></div>'
  +'<div class="rw"><span>'+t('sumRate').replace('{n}',pct(ans))+'</span><b>'+ans+' / '+tot+'</b></div>'
  +'<div class="rw"><span>'+t('sumOpen').replace('{n}',pct(c.o))+'</span><b>'+c.o+' / '+tot+'</b></div>'
  +'<div class="rw"><span>'+(times.length?t('sumLast'):t('sumNone'))+'</span><b>'+(times.length?ago(times[0])+(day?' · '+day+' '+t('sumDay'):''):'—')+'</b></div></div>'}

 h+=rows.length?'<div class="gl">'+rows.map(({g,i,s})=>'<div class="g"><span class="av">'+esc((g.n||'?').trim().charAt(0).toUpperCase())+'</span><div class="n"><b>'+esc(g.n)+'</b><span class="chip '+s.s+'">'+(s.s==='y'?IC.ok:'')+t('st')[s.s]+'</span>'+(s.o?'<span style="margin-left:8px;font-size:11px;color:#9C8B74;display:inline-flex;align-items:center;gap:4px">'+IC.eye+t('openedAt')+'</span>':'')+'</div><button class="ib '+(ST.copied===g.k?'ok':'')+'" data-cp="'+i+'">'+(ST.copied===g.k?IC.ok:IC.cp)+'</button><button class="ib" data-sh="'+i+'">'+IC.sh+'</button><button class="ib" data-gd="'+i+'" style="color:#B3A492">'+IC.tr+'</button></div>').join('')+'</div>':'<div class="empty">'+(it.guests.length?'—':t('emp')+'<br><span style="opacity:.8">'+t('empS')+'</span>')+'</div>';
 h+='<button class="b o" data-del="'+it.id+'" style="width:100%;justify-content:center;margin-top:28px;color:#B4433A;border-color:#E8C9C4">'+t('del')+'</button></div>';

 $$('[data-px]').forEach(b=>b.onclick=()=>{ST.draft.pr.splice(+b.dataset.px,1);if(!ST.draft.pr.length)ST.draft.pr.push(['','']);render()});
 const ap=$('[data-addp]');if(ap)ap.onclick=()=>{ST.draft.pr.push(['','']);render()};
 const sv=$('#sv');if(sv)sv.onclick=async()=>{const d=ST.draft;if(!d.a.trim()||!d.d){$('#er').textContent=t('needs');return}d.l=['ru','uz','en','kk'].includes(d.l)?d.l:LANG;normGuests(d);const i=ST.items.findIndex(x=>x.id===d.id);const isNew=i<0;if(isNew)ST.items.unshift(d);else ST.items[i]=d;await persist();hap();ST.cur=d.id;ST.draft=blank();ST.view=isNew?'done':'panel';render();{const sv2=ST.items.find(x=>x.id===d.id);if(sv2&&!isFresh(sv2)&&!pendingFor(sv2)){setTimeout(()=>doPublish(sv2),450)}}};
 const tog=$('#tog');if(tog)tog.onclick=()=>{ST.view='panel';render()};
 $$('[data-view]').forEach(b=>b.onclick=()=>{ST.cur=b.dataset.view;ST.filter='all';ST.view='panel';render();loadLog().then(()=>ST.view==='panel'&&render())});
 $$('[data-open]').forEach(b=>b.onclick=()=>openUrl(linkFor(ST.items.find(x=>x.id===b.dataset.open))));
 $$('[data-edit]').forEach(b=>b.onclick=()=>{const it=ST.items.find(x=>x.id===b.dataset.edit);ST.draft=JSON.parse(JSON.stringify(it));if(!ST.draft.pr||!ST.draft.pr.length)ST.draft.pr=[['','']];ST.view='form';render()});
 $$('[data-fl]').forEach(b=>b.onclick=()=>{ST.filter=ST.filter===b.dataset.fl?'all':b.dataset.fl;render()});
 const ga=$('#ga');if(ga)ga.onclick=async()=>{const v=$('#gn').value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean).slice(0,100);if(!v.length)return;const it=ST.items.find(x=>x.id===ST.cur);it.guests=it.guests.concat(v.map(n=>({n,k:uid()}))).slice(0,300);await persist();render()};
 $$('[data-gd]').forEach(b=>b.onclick=async()=>{const it=ST.items.find(x=>x.id===ST.cur);it.guests.splice(+b.dataset.gd,1);await persist();render()});
 $$('[data-sh]').forEach(b=>b.onclick=()=>{const it=ST.items.find(x=>x.id===ST.cur),i=+b.dataset.sh;share(linkFor(it,i),it.guests[i].n)});
 $$('[data-cp]').forEach(b=>b.onclick=async()=>{const it=ST.items.find(x=>x.id===ST.cur),i=+b.dataset.cp;await copy(linkFor(it,i));ST.copied=it.guests[i].k;render();setTimeout(()=>{ST.copied=null;ST.view==='panel'&&render()},1600)});
 $$('[data-qr]').forEach(b=>b.onclick=()=>{const it=ST.items.find(x=>x.id===b.dataset.qr);if(it)showQR(it)});
 loadWishes();
 $$('[data-wl]').forEach(b=>b.onclick=()=>{ST.wl=b.dataset.wl==='1';render()});
 $$('[data-shg]').forEach(b=>b.onclick=()=>{const it=ST.items.find(x=>x.id===b.dataset.shg);share(linkFor(it),it.a+(it.b?' & '+it.b:''))});
 $$('[data-del]').forEach(b=>b.onclick=()=>{const go=async()=>{ST.items=ST.items.filter(x=>x.id!==b.dataset.del);await persist();ST.view='mine';render()};V('6.2')?tg.showConfirm(t('delc'),ok=>{if(ok)go()}):(confirm(t('delc'))&&go())});
}
store.get().then(a=>{ST.items=(Array.isArray(a)?a:[]).map(normGuests);ST.items.forEach(i=>{i.gl=i.gl||[];i.pv=i.pv||{}});ST.view='home';render();loadLog();loadLib();loadPub().then(render)});
