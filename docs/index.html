<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>Marhabo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Manrope,system-ui,sans-serif;background:radial-gradient(120% 70% at 80% -10%,#F7EEDF 0%,#FCF9F3 45%,#FDFBF7 100%);color:#2B2219;min-height:100vh;padding:18px 16px 110px;-webkit-font-smoothing:antialiased}
.fd{font-family:'Cormorant Garamond',Georgia,serif}
.brand{text-align:center;padding-top:6px}
.brand small{display:block;font-size:10px;letter-spacing:.38em;text-transform:uppercase;color:#A08D74}
h1{font-size:40px;font-weight:500;line-height:1.05;margin-top:6px}
.sub{text-align:center;color:#8B7A66;font-size:13px;margin:8px 0 16px}
.orn{display:flex;justify-content:center;margin:10px 0 4px}
.lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#A08D74;margin:18px 0 7px}
input,textarea{width:100%;border:1px solid #EDE3D4;background:#fff;border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;color:#2B2219;outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:#B28A50}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{border:1px solid #EDE3D4;background:#fff;border-radius:14px;padding:12px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:all .2s}
.tpl b{display:block;font-size:14px;font-weight:600}
.tpl.on{border-color:#B28A50;background:#FBF3E6;box-shadow:0 0 0 1px #B28A50 inset}
.sw{display:flex;gap:6px;margin-top:8px}.sw i{width:14px;height:14px;border-radius:99px;display:block}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-size:13px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;background:#2B2219;color:#fff}
.btn.g{background:transparent;color:#2B2219;border:1px solid #D9CBB4}
.btn.s{padding:9px 14px;font-size:11px;width:auto;display:inline-block}
.card{background:#fff;border:1px solid #EDE3D4;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 18px 40px -34px #2B2219}
.card h3{font-size:24px;font-weight:500}
.meta{color:#8B7A66;font-size:12px;margin-top:2px}
.prow{display:grid;grid-template-columns:96px 1fr 38px;gap:8px;margin-bottom:8px}
.x{border:1px solid #EDE3D4;background:#fff;border-radius:12px;cursor:pointer;font-size:18px;color:#8B7A66}
.cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.cnt div{background:#fff;border:1px solid #EDE3D4;border-radius:12px;padding:10px 2px;text-align:center}
.cnt b{display:block;font-size:22px;font-weight:500}.cnt small{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#8B7A66}
.g{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #F1E8D9}
.g .n{flex:1;min-width:0}.g .n b{font-weight:600;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(252,249,243,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid #EDE3D4}
.tabs{display:flex;gap:6px;margin:6px 0 4px}.tabs button{flex:1;padding:11px;border-radius:12px;border:1px solid #EDE3D4;background:#fff;font:inherit;font-size:13px;cursor:pointer;color:inherit}
.tabs button.on{background:#2B2219;color:#fff;border-color:#2B2219}
.empty{text-align:center;color:#8B7A66;padding:36px 12px;font-size:14px}
.err{color:#B4433A;font-size:12px;margin-top:10px;text-align:center;min-height:16px}
.lang{position:absolute;right:14px;top:14px;font-size:11px;letter-spacing:.1em;border:1px solid #EDE3D4;background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;color:inherit}
.hint{font-size:11px;color:#A08D74;margin-top:6px;line-height:1.5}
.lk{display:flex;gap:8px;margin-top:10px}.lk input{font-size:12px}
.done{text-align:center;padding:10px 0}
.done .ck{width:56px;height:56px;border-radius:99px;background:#B28A50;color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:26px}
</style></head><body>
<button class="lang" id="lg">RU · UZ</button>
<div id="app"></div>
<script type="module">
import {TPL,pack} from './shared.js';
const BOT='__BOT__', OWNER_KEY='taklif_v1';
const tg=window.Telegram&&Telegram.WebApp; if(tg){tg.ready();tg.expand();try{if(tg.isVersionAtLeast('6.1')){tg.setHeaderColor('#FCF9F3');tg.setBackgroundColor('#FCF9F3')}}catch(e){}}
const me=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{};
const OWNER=String(me.id||'');
let LANG=(localStorage.getItem('lg')||(me.language_code||'ru').slice(0,2)); if(LANG!=='uz')LANG='ru';
const S={ru:{sub:'Заполните детали — открытка соберётся сама.',tabNew:'Создать',tabMine:'Мои',tpl:'Шаблон',n1:'Имя',n2:'Второе имя',date:'Дата',time:'Время',place:'Место',addr:'Адрес',map:'Ссылка на карту',photos:'Фотографии',cover:'Обложка (ссылка на фото)',portrait:'Портрет (ссылка на фото)',gallery:'Галерея (по одной ссылке в строке, до 6)',photoHint:'Если оставить пустым, подберём фото под шаблон.',music:'Ссылка на MP3',text:'Текст приглашения',prog:'Программа вечера',addp:'+ Добавить пункт',dress:'Дресс-код',contact:'Контакт',save:'Создать приглашение',needs:'Укажите имя и дату',none:'Пока нет приглашений',open:'Открыть',guests:'Гости',addg:'Добавить гостей',addhint:'Каждое имя с новой строки',add:'Добавить',del:'Удалить',delc:'Удалить приглашение?',edit:'Изменить',back:'← Назад',share:'Отправить',general:'Общая ссылка',personal:'Личные ссылки гостей',copy:'Копировать',copied:'Скопировано',created:'Приглашение готово',createdSub:'Теперь добавьте гостей: у каждого будет личная ссылка с его именем.',toGuests:'Добавить гостей',empty:'Добавьте имена — для каждого гостя появится личная ссылка.',gcount:'гостей',ph:'Для личной ссылки нужно имя'},
uz:{sub:"Tafsilotlarni kiriting — taklifnoma o'zi chiroyli bo'lib chiqadi.",tabNew:'Yaratish',tabMine:'Mening',tpl:'Shablon',n1:'Ism',n2:'Ikkinchi ism',date:'Sana',time:'Vaqt',place:'Joy',addr:'Manzil',map:'Xarita havolasi',photos:'Rasmlar',cover:'Muqova (rasm havolasi)',portrait:'Portret (rasm havolasi)',gallery:"Galereya (har qatorda bitta havola, 6 tagacha)",photoHint:"Bo'sh qoldirilsa, shablonga mos rasm tanlanadi.",music:'MP3 havolasi',text:'Taklifnoma matni',prog:'Kechqurun dasturi',addp:"+ Band qo'shish",dress:'Kiyim uslubi',contact:'Aloqa',save:'Taklifnoma yaratish',needs:'Ism va sanani kiriting',none:"Hozircha taklifnoma yo'q",open:'Ochish',guests:'Mehmonlar',addg:"Mehmon qo'shish",addhint:'Har bir ism yangi qatorda',add:"Qo'shish",del:"O'chirish",delc:"Taklifnoma o'chirilsinmi?",edit:"O'zgartirish",back:'← Orqaga',share:'Yuborish',general:'Umumiy havola',personal:'Mehmonlarning shaxsiy havolalari',copy:'Nusxa olish',copied:'Nusxa olindi',created:'Taklifnoma tayyor',createdSub:"Endi mehmonlarni qo'shing: har birida o'z ismi bilan shaxsiy havola bo'ladi.",toGuests:"Mehmon qo'shish",empty:"Ismlarni qo'shing — har biri uchun shaxsiy havola paydo bo'ladi.",gcount:'mehmon',ph:'Shaxsiy havola uchun ism kerak'}};
const TP=[['wedding','Свадьба',"To'y",'#B28A50','#EADBC4'],['birthday','День рождения',"Tug'ilgan kun",'#D2705A','#F7D8CE'],['anniversary','Юбилей','Yubiley','#2F6B52','#D6E6D9'],['nikah','Никах','Nikoh','#7E8B63','#E3E6D1'],['navruz','Навруз',"Navro'z",'#1F8A6D','#D2EADF'],['other','Другой праздник','Boshqa bayram','#7B4A63','#EADCE5']];
const t=k=>S[LANG][k],$=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SITE=location.origin+location.pathname.replace(/[^/]*$/,'');
const blank=()=>({id:Math.random().toString(36).slice(2,8),t:'wedding',l:LANG,a:'',b:'',d:'',h:'',pl:'',ad:'',m:'',x:'',dc:'',ct:'',u:'',c:'',o:'',g:'',pr:[['','']],guests:[]});
const ST={tab:'new',items:[],draft:blank(),view:null,created:null};

// ---------- хранилище: Telegram CloudStorage (с запасом на localStorage) ----------
const cs=(tg&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9'))?tg.CloudStorage:null;
const local={get:()=>{try{return JSON.parse(localStorage.getItem(OWNER_KEY)||'[]')}catch{return[]}},set:a=>{try{localStorage.setItem(OWNER_KEY,JSON.stringify(a))}catch(e){}}};
const store={
 get:()=>new Promise(r=>{
  const fb=()=>r(local.get()); if(!cs)return fb();
  try{cs.getItem(OWNER_KEY,(e,v)=>{ if(e)return fb(); try{const a=JSON.parse(v||'[]'); r(Array.isArray(a)&&(a.length||!local.get().length)?a:local.get())}catch{fb()}})}catch(e){fb()}
  setTimeout(fb,2500)}),
 set:(a)=>new Promise(r=>{ local.set(a); if(!cs)return r(); let done=false; const fin=()=>{if(!done){done=true;r()}};
  try{cs.setItem(OWNER_KEY,JSON.stringify(a),fin)}catch(e){fin()} setTimeout(fin,2500)})
};
const persist=()=>store.set(ST.items);
const urls=s=>String(s||'').split('\n').map(x=>x.trim()).filter(x=>/^https:\/\//.test(x)).slice(0,6);

// ---------- ссылки ----------
function payload(it,guest){
 const o={t:it.t,l:it.l,a:it.a,b:it.b,d:it.d,h:it.h,pl:it.pl,ad:it.ad,m:it.m,x:it.x,dc:it.dc,ct:it.ct,u:it.u,k:BOT,o:OWNER,i:it.id};
 const ph={}; if(/^https:/.test(it.c))ph.c=it.c; if(/^https:/.test(it.o))ph.o=it.o; const g=urls(it.g); if(g.length)ph.g=g; if(Object.keys(ph).length)o.p=ph;
 const pr=(it.pr||[]).filter(p=>p[1]&&p[1].trim()); if(pr.length)o.pr=pr;
 if(guest)o.g=guest; Object.keys(o).forEach(k=>(o[k]===''||o[k]==null)&&delete o[k]); return o}
const linkFor=(it,guest)=>SITE+'i.html#'+pack(payload(it,guest));

// ---------- отрисовка ----------
const ORN='<svg viewBox="0 0 200 24" width="150" height="18" fill="none" stroke="#B28A50" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M18 12H74"/><path d="M126 12H182"/><path d="M74 12c6-8 16-8 22 0-6 8-16 8-22 0Z"/><path d="M126 12c-6-8-16-8-22 0 6 8 16 8 22 0Z"/><path d="M100 3.5 108.5 12 100 20.5 91.5 12Z"/><circle cx="18" cy="12" r="1.6"/><circle cx="182" cy="12" r="1.6"/></svg>';
function head(){return '<div class="brand"><small>Marhabo</small><h1 class="fd">'+(LANG==='uz'?'Taklifnoma':'Приглашение')+'</h1></div><div class="orn">'+ORN+'</div><p class="sub">'+t('sub')+'</p><div class="tabs"><button class="'+(ST.tab==='new'?'on':'')+'" data-tab="new">'+t('tabNew')+'</button><button class="'+(ST.tab==='mine'?'on':'')+'" data-tab="mine">'+t('tabMine')+(ST.items.length?' ('+ST.items.length+')':'')+'</button></div>'}
function render(){let h=head(); if(ST.created)h+=doneView(); else if(ST.tab==='new')h+=form(); else h+=ST.view?panel():mine(); $('app').innerHTML=h; bind()}
function form(){const d=ST.draft;
 let h='<div class="lbl">'+t('tpl')+'</div><div class="tpls">'+TP.map(x=>'<button class="tpl '+(d.t===x[0]?'on':'')+'" data-tpl="'+x[0]+'"><b>'+(LANG==='uz'?x[2]:x[1])+'</b><div class="sw"><i style="background:'+x[3]+'"></i><i style="background:'+x[4]+'"></i></div></button>').join('')+'</div>';
 h+='<div class="row"><div><div class="lbl">'+t('n1')+'</div><input data-f="a" value="'+esc(d.a)+'" maxlength="60"></div><div><div class="lbl">'+t('n2')+'</div><input data-f="b" value="'+esc(d.b)+'" maxlength="60"></div></div>';
 h+='<div class="row"><div><div class="lbl">'+t('date')+'</div><input type="date" data-f="d" value="'+esc(d.d)+'"></div><div><div class="lbl">'+t('time')+'</div><input type="time" data-f="h" value="'+esc(d.h)+'"></div></div>';
 h+='<div class="lbl">'+t('place')+'</div><input data-f="pl" value="'+esc(d.pl)+'" maxlength="90"><div class="lbl">'+t('addr')+'</div><input data-f="ad" value="'+esc(d.ad)+'" maxlength="120"><div class="lbl">'+t('map')+'</div><input data-f="m" value="'+esc(d.m)+'" placeholder="https://" maxlength="300">';
 h+='<div class="lbl">'+t('photos')+'</div><input data-f="c" value="'+esc(d.c)+'" placeholder="'+t('cover')+'"><div style="height:8px"></div><input data-f="o" value="'+esc(d.o)+'" placeholder="'+t('portrait')+'"><div style="height:8px"></div><textarea data-f="g" placeholder="'+t('gallery')+'">'+esc(d.g)+'</textarea><p class="hint">'+t('photoHint')+'</p>';
 h+='<div class="lbl">'+t('music')+'</div><input data-f="u" value="'+esc(d.u)+'" placeholder="https://…mp3">';
 h+='<div class="lbl">'+t('text')+'</div><textarea data-f="x" maxlength="600">'+esc(d.x)+'</textarea>';
 h+='<div class="lbl">'+t('prog')+'</div>'+d.pr.map((p,i)=>'<div class="prow"><input type="time" data-p="'+i+'" data-k="0" value="'+esc(p[0])+'"><input data-p="'+i+'" data-k="1" value="'+esc(p[1])+'" maxlength="80"><button class="x" data-px="'+i+'">×</button></div>').join('')+(d.pr.length<10?'<button class="btn g s" data-addp>'+t('addp')+'</button>':'');
 h+='<div class="lbl">'+t('dress')+'</div><input data-f="dc" value="'+esc(d.dc)+'" maxlength="80"><div class="lbl">'+t('contact')+'</div><input data-f="ct" value="'+esc(d.ct)+'" maxlength="60">';
 return h+'<p class="err" id="er"></p><div class="bar"><button class="btn" id="sv">'+t('save')+'</button></div>'}
function mine(){if(!ST.items.length)return '<div class="empty">'+t('none')+'</div>'; return ST.items.map(it=>'<div class="card"><h3 class="fd">'+esc(it.a)+(it.b?' & '+esc(it.b):'')+'</h3><div class="meta">'+esc(it.d)+' · '+it.guests.length+' '+t('gcount')+'</div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn s" data-view="'+it.id+'">'+t('guests')+'</button><button class="btn g s" data-open="'+it.id+'">'+t('open')+'</button><button class="btn g s" data-edit="'+it.id+'">'+t('edit')+'</button></div></div>').join('')}
function doneView(){const it=ST.items.find(x=>x.id===ST.created); return '<div class="done" style="margin-top:20px"><div class="ck">✓</div><h3 class="fd" style="font-size:30px;font-weight:500">'+t('created')+'</h3><p class="sub">'+t('createdSub')+'</p></div><div class="bar"><button class="btn" id="tog">'+t('toGuests')+'</button></div>'}
function panel(){const it=ST.items.find(x=>x.id===ST.view); if(!it){ST.view=null;return mine()}
 let h='<button class="btn g s" data-back style="margin:10px 0">'+t('back')+'</button><div class="card"><h3 class="fd">'+esc(it.a)+(it.b?' & '+esc(it.b):'')+'</h3><div class="meta">'+esc(it.d)+'</div><div class="lk"><input readonly value="'+esc(linkFor(it))+'" id="gl"><button class="btn s" data-shg="'+it.id+'">'+t('share')+'</button></div><p class="hint">'+t('general')+'</p></div>';
 h+='<div class="lbl">'+t('addg')+'</div><textarea id="gn" placeholder="'+t('addhint')+'"></textarea><div style="margin-top:8px"><button class="btn s" id="ga">'+t('add')+'</button></div><div class="lbl">'+t('personal')+'</div>';
 h+=it.guests.length?it.guests.map((g,i)=>'<div class="g"><div class="n"><b>'+esc(g)+'</b></div><button class="btn s" data-sh="'+i+'">'+t('share')+'</button><button class="x" style="width:38px;height:38px" data-gd="'+i+'">×</button></div>').join(''):'<div class="empty">'+t('empty')+'</div>';
 return h+'<button class="btn g" data-del="'+it.id+'" style="margin-top:26px;color:#B4433A;border-color:#E8C9C4">'+t('del')+'</button>'}
const share=(url,text)=>{ if(tg)tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(text||'')); else{navigator.clipboard&&navigator.clipboard.writeText(url)} };
function bind(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ST.tab=b.dataset.tab;ST.view=null;ST.created=null;render()});
 document.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{ST.draft.t=b.dataset.tpl;render()});
 document.querySelectorAll('[data-f]').forEach(i=>i.oninput=()=>{ST.draft[i.dataset.f]=i.value});
 document.querySelectorAll('[data-p]').forEach(i=>i.oninput=()=>{ST.draft.pr[+i.dataset.p][+i.dataset.k]=i.value});
 document.querySelectorAll('[data-px]').forEach(b=>b.onclick=()=>{ST.draft.pr.splice(+b.dataset.px,1);if(!ST.draft.pr.length)ST.draft.pr.push(['','']);render()});
 const ap=document.querySelector('[data-addp]'); if(ap)ap.onclick=()=>{ST.draft.pr.push(['','']);render()};
 const sv=$('sv'); if(sv)sv.onclick=async()=>{const d=ST.draft; if(!d.a.trim()||!d.d){$('er').textContent=t('needs');return} d.l=LANG; const i=ST.items.findIndex(x=>x.id===d.id); if(i>=0)ST.items[i]=d; else ST.items.unshift(d); await persist(); ST.created=d.id; ST.draft=blank(); try{tg&&tg.isVersionAtLeast('6.1')&&tg.HapticFeedback.notificationOccurred('success')}catch(e){} render()};
 const tog=$('tog'); if(tog)tog.onclick=()=>{ST.view=ST.created;ST.created=null;ST.tab='mine';render()};
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{ST.view=b.dataset.view;render()});
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const it=ST.items.find(x=>x.id===b.dataset.open); const u=linkFor(it); tg?tg.openLink(u):window.open(u)});
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const it=ST.items.find(x=>x.id===b.dataset.edit); ST.draft=JSON.parse(JSON.stringify(it)); if(!ST.draft.pr||!ST.draft.pr.length)ST.draft.pr=[['','']]; ST.tab='new'; render()});
 const bk=document.querySelector('[data-back]'); if(bk)bk.onclick=()=>{ST.view=null;render()};
 const ga=$('ga'); if(ga)ga.onclick=async()=>{const v=$('gn').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,100); if(!v.length)return; const it=ST.items.find(x=>x.id===ST.view); it.guests=it.guests.concat(v).slice(0,300); await persist(); render()};
 document.querySelectorAll('[data-gd]').forEach(b=>b.onclick=async()=>{const it=ST.items.find(x=>x.id===ST.view); it.guests.splice(+b.dataset.gd,1); await persist(); render()});
 document.querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>{const it=ST.items.find(x=>x.id===ST.view); const g=it.guests[+b.dataset.sh]; share(linkFor(it,g), g)});
 document.querySelectorAll('[data-shg]').forEach(b=>b.onclick=()=>{const it=ST.items.find(x=>x.id===b.dataset.shg); share(linkFor(it), it.a+(it.b?' & '+it.b:''))});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const go=async()=>{ST.items=ST.items.filter(x=>x.id!==b.dataset.del); await persist(); ST.view=null; render()}; tg&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.2')?tg.showConfirm(t('delc'),ok=>{if(ok)go()}):(confirm(t('delc'))&&go())});
}
$('lg').onclick=()=>{LANG=LANG==='ru'?'uz':'ru';localStorage.setItem('lg',LANG);ST.draft.l=LANG;render()};
store.get().then(a=>{ST.items=Array.isArray(a)?a:[]; if(ST.items.length)ST.tab='mine'; render()});
</script></body></html>
