<style>

.tc .tx{padding:2px 10px 16px;text-align:center}.tc .nm{font-family:'Cormorant Garamond',serif;font-size:clamp(17px,5.1vw,20px);line-height:1.15;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tc .nm i{margin:0 3px}.tc .ht{font-size:9.5px;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.g{display:flex;align-items:center;gap:7px;padding:11px 12px;border-bottom:1px solid #F0E7D9}.g:last-child{border:0}
.av{flex:none;width:36px;height:36px;border-radius:99px;background:#F5EBDB;color:#8A6A3B;display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-size:16px}
.g .n{flex:1;min-width:0}.g .n b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:11px;margin-top:4px}
.chip.y{background:#E9F2EC;color:#2F6B52}.chip.n{background:#FBEDE9;color:#9C3B2A}.chip.p{background:#F4EFE7;color:#8A7B68}
.ib{flex:none;border:1px solid #E7DCCA;background:#fff;border-radius:11px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:#6E6152;-webkit-tap-highlight-color:transparent}.ib:active{transform:scale(.94)}

.lk{display:flex;gap:8px;margin-top:12px}.lk input{font-size:12px}
.done{text-align:center;padding:40px 0 10px}.done .ck{width:66px;height:66px;border-radius:99px;background:var(--ac);color:#fff;display:grid;place-items:center;margin:0 auto 16px;font-size:30px;animation:pop .6s cubic-bezier(.22,1,.36,1)}

.view{animation:vin .5s cubic-bezier(.22,1,.36,1)}@keyframes vin{from{opacity:0;transform:translateY(14px)}}

/* ---- хранилище ----
   CloudStorage: значение <= 4096 симв., ключей <= 1024. Каждое приглашение режется на части по 3500 симв.
   под ключами inv_<id>_<n>, список id лежит в idx. Локальные превью (pv) в облако не попадают. */
const cs=V('6.9')?tg.CloudStorage:null;
const CH=3500, LK='taklif_v3';
const L={get:()=>{try{return JSON.parse(localStorage.getItem(LK)||'[]')}catch{return[]}},set:a=>{try{localStorage.setItem(LK,JSON.stringify(a))}catch(e){}}};
const clean=it=>{const c=JSON.parse(JSON.stringify(it));delete c.pv;if(c.gl)c.gl=c.gl.filter(g=>g.url).map(g=>({url:g.url}));return c};
const csGet=k=>new Promise(r=>{let d=false;const f=v=>{if(!d){d=true;r(v)}};try{cs.getItem(k,(e,v)=>f(e?null:v))}catch(e){f(null)}setTimeout(()=>f(null),2500)});
const csSet=(k,v)=>new Promise(r=>{let d=false;const f=ok=>{if(!d){d=true;r(ok)}};try{cs.setItem(k,v,(e,ok)=>f(!e&&ok!==false))}catch(e){f(false)}setTimeout(()=>f(false),2500)});
const csDel=ks=>new Promise(r=>{if(!ks.length)return r();let d=false;const f=()=>{if(!d){d=true;r()}};try{cs.removeItems(ks,f)}catch(e){f()}setTimeout(f,2500)});
const store={
 async get(){
  const loc=L.get(); if(!cs)return loc;
  try{
   const idx=JSON.parse(await csGet('idx')||'null'); if(!Array.isArray(idx))return loc;
   const out=[];
   for(const e of idx){let s='';for(let n=0;n<e.n;n++){const part=await csGet('inv_'+e.id+'_'+n);if(part==null){s=null;break}s+=part}
    if(s){try{out.push(JSON.parse(s))}catch(x){}}}
   // локальные копии содержат превью — берём их, если id совпал
   return out.map(o=>{const l=loc.find(x=>x.id===o.id);return l?{...o,pv:l.pv||{},gl:(l.gl&&l.gl.length>=(o.gl||[]).length)?l.gl:o.gl}:o});
  }catch(e){return loc}},
 async set(items){
  L.set(items); if(!cs)return;
  let old=[];try{old=JSON.parse(await csGet('idx')||'[]')||[]}catch(e){}
  const idx=[];
  for(const it of items){const js=JSON.stringify(clean(it));const parts=[];for(let i=0;i<js.length;i+=CH)parts.push(js.slice(i,i+CH));
   let ok=true;for(let n=0;n<parts.length;n++){if(!await csSet('inv_'+it.id+'_'+n,parts[n])){ok=false;break}}
   if(ok)idx.push({id:it.id,n:parts.length})}
  await csSet('idx',JSON.stringify(idx));
  // убрать устаревшие ключи (удалённые приглашения и лишние части)
  const drop=[];for(const e of old){const cur=idx.find(x=>x.id===e.id);for(let n=cur?cur.n:0;n<e.n;n++)drop.push('inv_'+e.id+'_'+n)}
  await csDel(drop)}};
const persist=()=>store.set(ST.items);

/* ---- ссылки (без сервера) ---- */
const urls=s=>String(s||'').split('\n').map(x=>x.trim()).filter(x=>/^https:\/\//.test(x)).slice(0,6);
function payload(it,gIdx){
 const o={t:it.t,l:it.l,a:it.a,b:it.b,d:it.d,h:it.h,pl:it.pl,ad:it.ad,m:it.m,x:it.x,dc:it.dc,ct:it.ct,k:BOT,o:OWNER,i:it.id};
 const rel=u=>isRepo(u)?u.slice(SITE.length):(/^https:/.test(u||'')?u:'');
 const ph={};const c=rel(it.c),pt=rel(it.o),mu=rel(it.u);if(c)ph.c=c;if(pt)ph.o=pt;
 const g=(it.gl||[]).map(x=>rel(x.url)).filter(Boolean).slice(0,6);if(g.length)ph.g=g;
 if(mu)o.u=mu; if(Object.keys(ph).length)o.p=ph;
 const pr=(it.pr||[]).filter(p=>p[1]&&p[1].trim());if(pr.length)o.pr=pr;
 if(gIdx!=null){o.g=it.guests[gIdx].n;o.q=it.guests[gIdx].k}
 Object.keys(o).forEach(k=>(o[k]===''||o[k]==null)&&delete o[k]);return o}
/* публикация: бот кладёт docs/inv/<slug>.json и пишет индекс docs/inv/_<owner>.json (id -> slug) */
ST.pub={};
async function loadPub(){ if(!OWNER)return; try{const r=await fetch(SITE+'inv/_'+OWNER+'.json?_='+Date.now(),{cache:'no-store'});if(r.ok)ST.pub=await r.json()}catch(e){} }
const sig=it=>{const o=payload(it);delete o.g;delete o.q;const j=JSON.stringify(o);let h=5381;for(let i=0;i<j.length;i++)h=((h<<5)+h+j.charCodeAt(i))|0;return (h>>>0).toString(36)};
const slugOf=it=>ST.pub[it.id]||'';
const isFresh=it=>!!slugOf(it)&&it.ps===sig(it);
const longLink=(it,gIdx)=>SITE+'i.html#'+pack(payload(it,gIdx));
const linkFor=(it,gIdx)=>{const s=slugOf(it);if(!s)return longLink(it,gIdx);const base=SITE+'i/'+s;if(gIdx==null)return base;const g=it.guests[gIdx];return base+'?g='+encodeURIComponent(g.n.trim())+'&q='+g.k};
const publishText=it=>'#taklif '+pack(payload(it));
const doPublish=it=>{it.ps=sig(it);persist();const u='https://t.me/'+BOT+'?text='+encodeURIComponent(publishText(it));if(tg&&V('6.1'))tg.openTelegramLink(u);else window.open(u,'_blank')};
const gname=g=>typeof g==='string'?g:g.n;
function normGuests(it){it.guests=(it.guests||[]).map(g=>typeof g==='string'?{n:g,k:uid()}:g);return it}

/* ---- статистика гостей (из docs/data/<owner>.json, пишет бот) ---- */
async function loadLog(){ if(!OWNER)return; try{const r=await fetch(SITE+'data/'+OWNER+'.json?_='+Date.now(),{cache:'no-store'});if(r.ok)ST.log=await r.json()}catch(e){} }
const gstat=(it,g)=>{const e=ST.log[it.id+':'+g.k]||{};return {s:e.s||'p',o:e.o||null,w:e.w}};
const counts=it=>{let o=0,y=0,n=0;it.guests.forEach(g=>{const s=gstat(it,g);if(s.o)o++;if(s.s==='y')y++;if(s.s==='n')n++});return {total:it.guests.length,o,y,n,p:it.guests.length-y-n}};

function shrink(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('img'));im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=fr.result};fr.readAsDataURL(file)})}
function pickFile(accept,multiple){return new Promise(r=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=!!multiple;i.style.cssText='position:fixed;left:-999px;opacity:0';document.body.appendChild(i);i.onchange=()=>{const f=[...i.files];i.remove();r(f)};i.addEventListener('cancel',()=>{i.remove();r([])});i.click()})}

 const tag=has?(isRepo(url)?'<span class="tag2 ok">'+t('saved')+'</span>':'<span class="tag2 wt">'+t('local')+'</span>'):'';
 return '<div class="up2 '+(has?'has':'')+'">'+th+'<div class="ti"><b>'+title+'</b><span>'+(has?(key==='u'&&d.pv.uN?esc(d.pv.uN):sub):sub)+'</span>'+tag+'</div><div class="ac"><button class="sm pr" data-pick="'+key+'">'+(has?t('replace'):t('choose2'))+'</button>'+(has?'<button class="sm rm" data-clr="'+key+'">'+t('rm')+'</button>':'')+'</div></div>'}


/* ---- отпечаток картинки 8x8: точное сопоставление локального фото и файла из репозитория, независимо от порядка ---- */
function imgFP(src){return new Promise(res=>{const im=new Image();if(!/^data:/.test(src))im.crossOrigin='anonymous';im.onerror=()=>res(null);im.onload=()=>{try{const c=document.createElement('canvas');c.width=8;c.height=8;const x=c.getContext('2d');x.drawImage(im,0,0,8,8);const d=x.getImageData(0,0,8,8).data,g=[];for(let i=0;i<64;i++)g.push(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11);const m=g.reduce((a,b)=>a+b,0)/64;res(g.map(v=>v>m?1:0).join(''))}catch(e){res(null)}};im.src=src})}
const ham=(a,b)=>{if(!a||!b)return 64;let n=0;for(let i=0;i<64;i++)if(a[i]!==b[i])n++;return n};

/* ---- автопривязка: файлы, которые бот сохранил в репозиторий, заменяют локальные ---- */
function pendingSlots(d){const a=[];['c','o'].forEach(k=>{if(d.pv&&d.pv[k]&&!d[k])a.push({k,kind:'photo'})});(d.gl||[]).forEach((g,i)=>{if(g.pv&&!g.url)a.push({k:'g',i,kind:'photo'})});if(d.pv&&d.pv.u&&!d.u)a.push({k:'u',kind:'audio'});return a}
function pendingCount(){const d=ST.draft;return d?pendingSlots(d).length:0}
const pendingFor=it=>pendingSlots(it).length;
const waitingItems=()=>ST.items.filter(i=>pendingFor(i)>0);
async function autoAttach(d){
  if(!d||!ST.lib.length)return 0;
  const since=(d.pv&&d.pv.at)||0, used=new Set([d.c,d.o,d.u,...(d.gl||[]).map(g=>g.url)].filter(Boolean));
  const fresh=kind=>ST.lib.filter(x=>x.k===kind&&!used.has(x.url)&&(Date.parse(x.t)||0)>=since-60000).sort((a,b)=>(Date.parse(a.t)||0)-(Date.parse(b.t)||0));
  let n=0; const ph=fresh('photo'), au=fresh('audio');
  // отпечатки новых файлов в хранилище
  const fps=[]; for(const x of ph){fps.push({x,f:await imgFP(x.url)})}
  const slots=pendingSlots(d);
  const fpOf=sl=>sl.k==='g'?d.gl[sl.i].fp:(d.pv||{})[sl.k+'F'];
  const put=(sl,x)=>{if(sl.k==='g'){d.gl[sl.i].url=x.url;delete d.gl[sl.i].pv;delete d.gl[sl.i].fp}else{d[sl.k]=x.url;delete d.pv[sl.k];delete d.pv[sl.k+'F']}n++};
  // 1 проход: точное совпадение по отпечатку
  const left=[];
  for(const sl of slots){
    if(sl.kind==='audio'){
      const want=d.pv.uK, hit=au.find(x=>Math.abs((+x.kb||0)-want)<=2)||(au.length===1?au[0]:null);
      if(hit){d.u=hit.url;delete d.pv.u;delete d.pv.uN;delete d.pv.uK;au.splice(au.indexOf(hit),1);n++}
      continue;
    }
    let best=null,bd=99; for(const c of fps){const dd=ham(fpOf(sl),c.f);if(dd<bd){bd=dd;best=c}}
    if(best&&bd<=10){put(sl,best.x);fps.splice(fps.indexOf(best),1)}else left.push(sl);
  }
  // 2 проход: что не опознали по картинке — по порядку загрузки
  for(const sl of left){const c=fps.shift();if(c)put(sl,c.x)}
  return n;
}

let _polling=0;
async function syncFiles(){
  if(!OWNER||_polling)return; _polling=1;
  try{
    await loadLib(); let changed=false;
    if(ST.draft&&pendingCount()&&(await autoAttach(ST.draft))) changed=true;
    for(const it of waitingItems()){
      const n=await autoAttach(it);
      if(n){changed=true;await persist(); if(!pendingFor(it)&&!isFresh(it)){ST.autoPub=it.id}}
    }
    if(changed)render(); else if(ST.view==='form'){const b=$('#fsync');if(b)b.innerHTML=syncBanner()}
    if(ST.autoPub){const it=ST.items.find(x=>x.id===ST.autoPub);ST.autoPub=null;if(it&&!isFresh(it)){ST.pubNote=it.id;doPublish(it)}}
  }finally{_polling=0}
}

function observe(){const els=$$('.rv');if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('on'));return}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}}),{rootMargin:'-30px 0px'});els.forEach(e=>io.observe(e))}
const share=(url,txt)=>{const u='https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(txt||'');if(tg&&V('6.1'))tg.openTelegramLink(u);else window.open(u,'_blank')};
const copy=async s=>{try{await navigator.clipboard.writeText(s);return true}catch{const a=document.createElement('textarea');a.value=s;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch{}a.remove();return ok}};
const openUrl=u=>{if(tg&&V('6.1'))tg.openLink(u);else window.open(u,'_blank')};
const hap=()=>{try{V('6.1')&&tg.HapticFeedback.notificationOccurred('success')}catch(e){}};

function bind(){
 $$('[data-lg]').forEach(b=>b.onclick=()=>{LANG=b.dataset.lg;localStorage.setItem('lg',LANG);ST.draft.l=LANG;render()});
 $$('[data-go]').forEach(b=>b.onclick=()=>{ST.view=b.dataset.go;render()});
 $$('[data-new]').forEach(b=>b.onclick=()=>{ST.draft=blank();ST.draft.t=b.dataset.new;ST.draft.l=LANG;ST.view='form';render()});
 const dm=$('[data-demo]');if(dm)dm.onclick=()=>{const it=blank();Object.assign(it,{a:'Азиз',b:'Дилноза',d:'2027-06-12',h:'18:00',pl:'Ресторан «Версаль»',ad:'ул. Амира Темура, 12',pr:[['18:00','Встреча гостей'],['19:00','Церемония'],['20:00','Праздничный ужин']]});openUrl(linkFor(it,null).replace('#','#')+'')};

 $$('[data-pick]').forEach(b=>b.onclick=async()=>{const k=b.dataset.pick,audio=k==='u';const fs=await pickFile(audio?'audio/*,.mp3,.m4a':'image/*',false);if(!fs.length)return;const f=fs[0];
  if(audio){if(f.size>25*1024*1024){alert(t('mediaBig'));return}ST.draft.pv.uN=f.name+' · '+Math.round(f.size/1024)+' KB';ST.draft.pv.uK=Math.round(f.size/1024);ST.draft.u='';ST.draft.pv.u='1';ST.draft.pv.at=Date.now()}
  else{try{ST.draft.pv[k]=await shrink(f,k==='c'?900:700,.72);ST.draft[k]='';ST.draft.pv.at=Date.now();ST.draft.pv[k+'F']=await imgFP(ST.draft.pv[k])}catch(e){alert(t('badimg'));return}}
  render()});
 $$('[data-clr]').forEach(b=>b.onclick=()=>{const k=b.dataset.clr;ST.draft[k]='';delete ST.draft.pv[k];if(k==='u')delete ST.draft.pv.uN;render()});
 const gad=$('[data-gadd]');if(gad)gad.onclick=async()=>{const fs=await pickFile('image/*',true);if(!fs.length)return;for(const f of fs){if(ST.draft.gl.length>=6)break;try{{const pv=await shrink(f,420,.7);ST.draft.gl.push({pv,url:'',fp:await imgFP(pv)})}}catch(e){}}render()};
 $$('[data-gx]').forEach(b=>b.onclick=()=>{ST.draft.gl.splice(+b.dataset.gx,1);render()});
 const tb=$('[data-tobot]');if(tb)tb.onclick=toBot;
 const ck=$('[data-chk]');if(ck)ck.onclick=async()=>{ck.textContent='…';await loadLib();render()};
 $$('[data-use]').forEach(b=>b.onclick=()=>{const u=b.dataset.use,kind=b.dataset.kind;
  if(kind==='audio'){ST.draft.u=u;delete ST.draft.pv.u;delete ST.draft.pv.uN}
  else if(!ST.draft.c){ST.draft.c=u;delete ST.draft.pv.c}
  else if(!ST.draft.o){ST.draft.o=u;delete ST.draft.pv.o}
  else if(ST.draft.gl.length<6)ST.draft.gl.push({url:u,pv:u});
  render()});

 $$('[data-pub]').forEach(b=>b.onclick=()=>{const it=ST.items.find(x=>x.id===b.dataset.pub);if(!it.a||!it.a.trim()){alert(t('needName'));return}doPublish(it)});
 $$('[data-pubchk]').forEach(b=>b.onclick=async()=>{b.textContent='…';await loadPub();render()});
 $$('[data-tpl]').forEach(b=>b.onclick=()=>{ST.draft.t=b.dataset.tpl;$$('.tp').forEach(x=>x.classList.toggle('on',x===b));const pb=$('#pvb');if(pb)pb.innerHTML=preview(ST.draft);const ta=$('[data-f=x]');if(ta)ta.placeholder=TPL[ST.draft.t].greeting[LANG]});
 $$('[data-f]').forEach(i=>i.oninput=()=>{ST.draft[i.dataset.f]=i.value;const pb=$('#pvb');if(pb)pb.innerHTML=preview(ST.draft)});
 $$('[data-p]').forEach(i=>i.oninput=()=>{ST.draft.pr[+i.dataset.p][+i.dataset.k]=i.value});
 $$('[data-px]').forEach(b=>b.onclick=()=>{ST.draft.pr.splice(+b.dataset.px,1);if(!ST.draft.pr.length)ST.draft.pr.push(['','']);render()});
 const ap=$('[data-addp]');if(ap)ap.onclick=()=>{ST.draft.pr.push(['','']);render()};
 const sv=$('#sv');if(sv)sv.onclick=async()=>{const d=ST.draft;if(!d.a.trim()||!d.d){$('#er').textContent=t('needs');return}d.l=LANG;normGuests(d);const i=ST.items.findIndex(x=>x.id===d.id);const isNew=i<0;if(isNew)ST.items.unshift(d);else ST.items[i]=d;await persist();hap();ST.cur=d.id;ST.draft=blank();ST.view=isNew?'done':'panel';render();{const sv2=ST.items.find(x=>x.id===d.id);if(sv2&&!isFresh(sv2)&&!pendingFor(sv2)){setTimeout(()=>doPublish(sv2),450)}}};
 const tog=$('#tog');if(tog)tog.onclick=()=>{ST.view='panel';render()};
 $$('[data-view]').forEach(b=>b.onclick=()=>{ST.cur=b.dataset.view;ST.filter='all';ST.view='panel';render();loadLog().then(()=>ST.view==='panel'&&render())});
 $$('[data-open]').forEach(b=>b.onclick=()=>openUrl(linkFor(ST.items.find(x=>x.id===b.dataset.open))));
 $$('[data-edit]').forEach(b=>b.onclick=()=>{const it=ST.items.find(x=>x.id===b.dataset.edit);ST.draft=JSON.parse(JSON.stringify(it));if(!ST.draft.pr||!ST.draft.pr.length)ST.draft.pr=[['','']];ST.view='form';render()});
 $$('[data-fl]').forEach(b=>b.onclick=()=>{ST.filter=ST.filter===b.dataset.fl?'all':b.dataset.fl;render()});
 const ga=$('#ga');if(ga)ga.onclick=async()=>{const v=$('#gn').value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean).slice(0,100);if(!v.length)return;const it=ST.items.find(x=>x.id===ST.cur);it.guests=it.guests.concat(v.map(n=>({n,k:uid()}))).slice(0,300);await persist();render()};
 $$('[data-gd]').forEach(b=>b.onclick=async()=>{const it=ST.items.find(x=>x.id===ST.cur);it.guests.splice(+b.dataset.gd,1);await persist();render()});
 $$('[data-sh]').forEach(b=>b.onclick=()=>{const it=ST.items.find(x=>x.id===ST.cur),i=+b.dataset.sh;share(linkFor(it,i),it.guests[i].n)});
 $$('[data-cp]').forEach(b=>b.onclick=async()=>{const it=ST.items.find(x=>x.id===ST.cur),i=+b.dataset.cp;await copy(linkFor(it,i));ST.copied=it.guests[i].k;render();setTimeout(()=>{ST.copied=null;ST.view==='panel'&&render()},1600)});
 $$('[data-shg]').forEach(b=>b.onclick=()=>{const it=ST.items.find(x=>x.id===b.dataset.shg);share(linkFor(it),it.a+(it.b?' & '+it.b:''))});
 $$('[data-del]').forEach(b=>b.onclick=()=>{const go=async()=>{ST.items=ST.items.filter(x=>x.id!==b.dataset.del);await persist();ST.view='mine';render()};V('6.2')?tg.showConfirm(t('delc'),ok=>{if(ok)go()}):(confirm(t('delc'))&&go())});
}
store.get().then(a=>{ST.items=(Array.isArray(a)?a:[]).map(normGuests);ST.items.forEach(i=>{i.gl=i.gl||[];i.pv=i.pv||{}});ST.view='home';render();loadLog();loadLib();loadPub().then(render)});
</script></body></html>
