name: CI

on:
  push:
    branches: [main]
    paths: ['docs/**', 'bot/**', 'worker/**', 'ci/**', '.github/workflows/ci.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Проверки (синтаксис, контраст, списки, секреты)
        run: node ci/check.mjs
      - name: Тест воркера
        run: node worker/test_worker.mjs
