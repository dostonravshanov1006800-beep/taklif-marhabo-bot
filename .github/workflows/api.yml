name: API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/worker.js', '.github/workflows/api.yml']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Deploy worker and set BOT_TOKEN secret
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -e
          A="https://api.cloudflare.com/client/v4/accounts/$CF_ACC"
          KV=$(curl -s "$A/storage/kv/namespaces?per_page=100" -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import sys,json;print(next(n['id'] for n in json.load(sys.stdin)['result'] if n['title']=='taklif-inv'))")
          cat > meta.json <<JSON
          {"main_module":"worker.js","compatibility_date":"2025-01-01","bindings":[{"type":"kv_namespace","name":"INV","namespace_id":"$KV"}],"keep_bindings":["secret_text"]}
          JSON
          curl -s -f -X PUT "$A/workers/scripts/taklif-api" -H "Authorization: Bearer $CF_TOKEN" \
            -F "metadata=@meta.json;type=application/json" \
            -F "worker.js=@worker/worker.js;type=application/javascript+module;filename=worker.js" | python3 -c "import sys,json;d=json.load(sys.stdin);print('deploy',d['success']);sys.exit(0 if d['success'] else 1)"
          python3 - <<'PY'
          import os, json, urllib.request
          u = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACC']}/workers/scripts/taklif-api/secrets"
          r = urllib.request.Request(u, data=json.dumps({"name": "BOT_TOKEN", "text": os.environ["BOT_TOKEN"], "type": "secret_text"}).encode(),
                                     headers={"Authorization": "Bearer " + os.environ["CF_TOKEN"], "Content-Type": "application/json"}, method="PUT")
          print("secret BOT_TOKEN set:", json.load(urllib.request.urlopen(r, timeout=20)).get("success"))
          PY
