name: Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'   # страховка: поднимет бота, если он остановился
  push:
    branches: [main]
    paths: ['bot/**', '.github/workflows/bot.yml']

# Только один бот одновременно. Новый запуск ждёт, а не убивает работающий.
concurrency:
  group: taklif-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Run bot (long polling)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          RUN_MINUTES: '340'
        run: node bot/bot.mjs
      - name: Save offset
        if: always()
        run: |
          git config user.name "marhabo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/offset.txt
          git diff --cached --quiet || (git commit -m "bot: offset [skip ci]" && git pull --rebase -q && git push -q)
      - name: Restart itself
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo "${{ github.repository }}" || true
